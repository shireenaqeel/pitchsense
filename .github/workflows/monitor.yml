# Every six hours, check that the game, the app and the leaderboard database
# answer. A failed check fails the run, and GitHub emails the repo owner.
#
# The checks also keep the free tiers awake: a Hugging Face Space sleeps after
# 48 hours without visitors, and a Supabase project pauses after a week without
# requests.
name: Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GAME_URL: https://shireenaqeel.github.io/pitchsense/
  SPACE_URL: https://shireenaqeel-pitchsense.hf.space

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Game (GitHub Pages)
        run: curl --fail --silent --show-error --output /dev/null --retry 3 --retry-delay 10 "$GAME_URL"
      - name: App (Hugging Face Space)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "No Space deployed yet"; exit 0; fi
          # A sleeping Space takes a minute or two to wake, so keep trying.
          curl --fail --silent --show-error --retry 10 --retry-delay 30 --retry-all-errors "$SPACE_URL/_stcore/health"
      - name: Leaderboard (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then echo "No Supabase settings yet"; exit 0; fi
          auth=()
          case "$SUPABASE_KEY" in sb_*) ;; *) auth=(-H "Authorization: Bearer $SUPABASE_KEY") ;; esac
          curl --fail --silent --show-error --output /dev/null --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_KEY" "${auth[@]}" "$SUPABASE_URL/rest/v1/leaderboard?select=id&limit=1"
