# Every six hours, check that the game (on GitHub Pages and Hugging Face), the
# Streamlit app and the leaderboard database answer. A failed check fails the
# run, and GitHub emails the repo owner.
#
# The Supabase check also keeps its free project from pausing after a week
# without requests. A sleeping Streamlit Community Cloud app still answers (with
# its wake-up page), so that check only proves the app's address is up.
#
# The app's address is the APP_URL repository variable (not a secret). Only the
# Supabase check uses secrets, from the master-only "production" environment.
name: Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GAME_URL: https://shireenaqeel.github.io/pitchsense/
  SPACE_URL: https://shireenaqeel-pitchsense.static.hf.space
  APP_URL: ${{ vars.APP_URL }}

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Game (GitHub Pages)
        run: curl --fail --silent --show-error --output /dev/null --retry 3 --retry-delay 10 "$GAME_URL"
      - name: Game (Hugging Face Space)
        run: |
          if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' "$SPACE_URL")" = 404 ]; then
            echo "No Space deployed yet"; exit 0
          fi
          curl --fail --silent --show-error --output /dev/null --retry 3 --retry-delay 10 "$SPACE_URL"
      - name: App (Streamlit Community Cloud)
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL is not set yet"; exit 0; fi
          curl --fail --silent --show-error --location --output /dev/null --retry 3 --retry-delay 10 "$APP_URL"
      - name: Leaderboard (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then echo "No Supabase settings yet"; exit 0; fi
          # Only the origin: the saved URL may be the REST address (.../rest/v1/).
          base=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^[[:space:]]*(https?://[^/[:space:]]+).*#\1#')
          auth=()
          case "$SUPABASE_KEY" in sb_*) ;; *) auth=(-H "Authorization: Bearer $SUPABASE_KEY") ;; esac
          # On failure, print Supabase's own error message (it never echoes the key).
          for attempt in 1 2 3; do
            body=$(curl --silent --show-error --write-out '\n%{http_code}' \
              -H "apikey: $SUPABASE_KEY" "${auth[@]}" "$base/rest/v1/leaderboard?select=id&limit=1") || body=$'\n000'
            code=${body##*$'\n'}
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::Supabase answered $code: $(printf '%s' "${body%$'\n'*}" | head -c 300)"
          exit 1
