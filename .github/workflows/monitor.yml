# Every six hours, check that the game, the app and the leaderboard database
# answer. A failed check fails the run, and GitHub emails the repo owner.
#
# The checks also keep the free tiers awake: a Hugging Face Space sleeps after
# 48 hours without visitors, and a Supabase project pauses after a week without
# requests.
#
# Only the Supabase check uses secrets, from the master-only "production"
# environment; the Hugging Face token is never needed here.
name: Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GAME_URL: https://shireenaqeel.github.io/pitchsense/
  SPACE_URL: https://shireenaqeel-pitchsense.hf.space

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Game (GitHub Pages)
        run: curl --fail --silent --show-error --output /dev/null --retry 3 --retry-delay 10 "$GAME_URL"
      - name: App (Hugging Face Space)
        run: |
          if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' "$SPACE_URL")" = 404 ]; then
            echo "No Space deployed yet"; exit 0
          fi
          # A sleeping Space takes a minute or two to wake, so keep trying.
          curl --fail --silent --show-error --retry 10 --retry-delay 30 --retry-all-errors "$SPACE_URL/_stcore/health"
      - name: Leaderboard (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then echo "No Supabase settings yet"; exit 0; fi
          # Only the origin: the saved URL may be the REST address (.../rest/v1/).
          base=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^[[:space:]]*(https?://[^/[:space:]]+).*#\1#')
          auth=()
          case "$SUPABASE_KEY" in sb_*) ;; *) auth=(-H "Authorization: Bearer $SUPABASE_KEY") ;; esac
          # On failure, print Supabase's own error message (it never echoes the key).
          for attempt in 1 2 3; do
            body=$(curl --silent --show-error --write-out '\n%{http_code}' \
              -H "apikey: $SUPABASE_KEY" "${auth[@]}" "$base/rest/v1/leaderboard?select=id&limit=1") || body=$'\n000'
            code=${body##*$'\n'}
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::Supabase answered $code: $(printf '%s' "${body%$'\n'*}" | head -c 300)"
          exit 1
