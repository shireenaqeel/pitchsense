# The Python tests, including a smoke test that renders every tab of the app.
# When they pass on master, the streamlit branch is moved to that commit.
# Streamlit Community Cloud deploys the app from that branch, so a commit that
# fails the tests never reaches the live app.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Runs no third-party code, so it alone may write to the repository.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: streamlit-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the streamlit branch to this commit
        run: git push --force origin "$GITHUB_SHA:refs/heads/streamlit"
