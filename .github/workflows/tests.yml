# The Python tests, including a smoke test that renders every tab of the app.
# When they pass on master, the streamlit branch is moved to that commit.
# Streamlit Community Cloud deploys the app from that branch, so a commit that
# fails the tests never reaches the live app.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Runs no third-party code, so it alone may write to the repository.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: streamlit-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Move the streamlit branch to this commit
        run: git push --force origin "$GITHUB_SHA:refs/heads/streamlit"
