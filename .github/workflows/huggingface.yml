# Publish the Streamlit app to its Hugging Face Space, once the tests have
# passed on master. The Space holds only what the app needs at runtime,
# assembled here, plus the Space's own Dockerfile and README from
# deploy/huggingface. The job then waits for the Space to build and start, and
# fails (which emails the repo owner) if it doesn't.
#
# Secrets live in the "production" environment, which only master can use:
# HF_TOKEN (a fine-grained token that can write to this Space only), and
# SUPABASE_URL and SUPABASE_KEY, which are copied to the Space's own secrets so
# the leaderboard is kept in Supabase. Skipped until HF_TOKEN is set.
#
# workflow_run fires for any Tests run whose branch is *named* master, which
# includes a pull request from a fork's own master. The job therefore only runs
# for a push to this repository, so outside code never sees the secrets.
name: Hugging Face

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface
  cancel-in-progress: true

env:
  SPACE: shireenaqeel/pitchsense
  SPACE_URL: https://shireenaqeel-pitchsense.hf.space

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check for the token
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: echo "present=${{ env.HF_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit the tests passed on, not whatever master is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Assemble the Space
        if: steps.token.outputs.present == 'true'
        run: |
          mkdir space
          cp -r streamlit_app.py requirements.txt .streamlit src models space/
          mkdir space/data && cp data/*.parquet space/data/
          cp deploy/huggingface/Dockerfile deploy/huggingface/README.md space/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.13"
      - name: Upload and wait for the Space to start
        if: steps.token.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          pip install "huggingface_hub==2.3.0"
          python deploy/huggingface/publish.py
      - name: Check the app answers
        if: steps.token.outputs.present == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors "$SPACE_URL/_stcore/health"
