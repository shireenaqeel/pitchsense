# Publish the Streamlit app to its Hugging Face Space. The Space holds only
# what the app needs at runtime, assembled here, plus the Space's own Dockerfile
# and README from deploy/huggingface. Skipped until the HF_TOKEN secret is set.
name: Hugging Face

on:
  push:
    branches: [master]
    paths-ignore: ["game/**", "docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface
  cancel-in-progress: true

env:
  SPACE: shireenaqeel/pitchsense

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the token
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: echo "present=${{ env.HF_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assemble the Space
        if: steps.token.outputs.present == 'true'
        run: |
          mkdir space
          cp -r streamlit_app.py requirements.txt .streamlit src models space/
          mkdir space/data && cp data/*.parquet space/data/
          cp deploy/huggingface/Dockerfile deploy/huggingface/README.md space/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.13"
      - name: Upload
        if: steps.token.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install "huggingface_hub==2.3.0"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["SPACE"], repo_type="space", folder_path="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}", delete_patterns=["*"],
          )
          PY
