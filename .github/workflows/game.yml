# Build the browser game from the committed caches and models, and publish it
# to GitHub Pages. The game data is exported
# here rather than committed, so it can never drift from the models in the repo.
# Pull requests build and test the game but don't publish it.
name: Game

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs no npm packages, gets
# the rights to publish.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export game data
        run: PYTHONPATH=src python -m pitchsense.export_game
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - working-directory: game
        env:
          # The leaderboards' Supabase project. These are repository variables,
          # not secrets: a browser game ships them to every player, and the
          # table's own rules (supabase/game_scores.sql) are what protect it.
          # Without them the build shows the boards as offline.
          VITE_SUPABASE_URL: ${{ vars.GAME_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.GAME_SUPABASE_KEY }}
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: game/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

