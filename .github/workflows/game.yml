# Build the browser game from the committed caches and models, and publish it
# to GitHub Pages and to a static Hugging Face Space. The game data is exported
# here rather than committed, so it can never drift from the models in the repo.
# Pull requests build and test the game but don't publish it.
name: Game

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the publishing jobs, which run no npm packages,
# get the rights or secrets to publish.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export game data
        run: PYTHONPATH=src python -m pitchsense.export_game
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - working-directory: game
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: game/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-dist
          path: game/dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The same build, as a static Space. Its token lives in the "production"
  # environment, which only master can use, and this job never runs for pull
  # requests. Skipped until HF_TOKEN is set.
  huggingface:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SPACE: shireenaqeel/pitchsense
    steps:
      - name: Check for the token
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: echo "present=${{ env.HF_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: deploy/huggingface
      - if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: game-dist
          path: space
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.13"
      - name: Upload and wait for the Space
        if: steps.token.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cp deploy/huggingface/README.md space/
          pip install "huggingface_hub==2.3.0"
          python deploy/huggingface/publish.py
