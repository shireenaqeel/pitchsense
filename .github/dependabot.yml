# Weekly pull requests for dependency updates, security fixes included. Each
# one runs the tests before it can be merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /game
    schedule:
      interval: weekly
    groups:
      game:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
