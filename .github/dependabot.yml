# Weekly pull requests for minor and patch updates, each of which runs the
# tests. Major versions (a new Phaser, Vite or TypeScript, a new action major)
# change behaviour, so they are upgraded by hand rather than proposed weekly.
# Security fixes come separately, as Dependabot security updates.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /game
    schedule:
      interval: weekly
    groups:
      game:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
