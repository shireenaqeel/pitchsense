<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%2334d399'/%3E%3C/svg%3E" />
    <title>PitchSense: Scout Career</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1410; overflow: hidden; }
      #game { width: 100vw; height: 100vh; }
      /* Preload both families so Phaser text has them on first draw. */
      .font-warm { position: absolute; left: -9999px; }
      /* The game is widescreen: on a phone held upright, suggest turning it.
         It sits in the empty band above the letterboxed canvas and ignores taps. */
      .rotate { display: none; }
      @media (orientation: portrait) and (max-width: 700px) {
        .rotate { display: flex; position: fixed; left: 16px; right: 16px; top: 18vh; z-index: 5; pointer-events: none;
          justify-content: center; align-items: center; gap: 10px; color: #9db5a6; font: 600 15px/1.4 Inter, system-ui, sans-serif; text-align: center; }
        .rotate svg { flex: none; width: 26px; height: 26px; }
      }
      /* Shown instead of the game when it can't run (see main.ts). */
      .fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px 16px; background: #0b1410;
        color: #f1f7f2; font: 17px/1.6 Inter, system-ui, sans-serif; text-align: center; z-index: 20; }
      .fail[hidden] { display: none; }
      .fail div { max-width: 480px; }
      .fail h1 { font: 900 clamp(34px, 9vw, 52px)/1.1 Bungee, Impact, system-ui, sans-serif; color: #facc15; margin: 0 0 16px; }
      .fail p { color: #9db5a6; margin: 0 0 26px; }
      .fail button { font: 800 17px Inter, system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.04em; color: #052e1c;
        background: #34d399; border: 0; border-radius: 12px; padding: 16px 28px; cursor: pointer; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35); }
    </style>
  </head>
  <body>
    <span class="font-warm" style="font-family: Bungee">.</span>
    <span class="font-warm" style="font-family: Inter; font-weight: 800">.</span>
    <div id="game"></div>
    <div class="rotate" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="2" width="10" height="20" rx="2" /><path d="M2 12a10 10 0 0 0 4 8" /><path d="M2 20h4v-4" />
      </svg>
      <span>Turn your phone sideways for the best view</span>
    </div>
    <noscript>
      <div class="fail"><div><h1>Kick-off delayed</h1><p>PitchSense runs in your browser, so it needs JavaScript. Turn it on and reload the page.</p></div></div>
    </noscript>
    <div class="fail" id="crash" role="alert" hidden>
      <div>
        <h1>Stoppage time</h1>
        <p>Something went wrong and the game stopped. Your progress is saved in this browser, so reloading picks up where you left off.</p>
        <button type="button" id="reload">Reload the game</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
